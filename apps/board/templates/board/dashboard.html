{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>MSG Board Preview</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2c; --border: #2a3346; --text: #e6e9f2; --muted: #8b93a8;
    --accent: #5b8cff; --good: #3ecf8e; --bad: #ff6b6b; --warn: #f5b74e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Pretendard, sans-serif; font-size: 14px;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  #authBox { display: flex; align-items: center; gap: 8px; }
  #authBox input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 6px; width: 110px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  main {
    display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; padding: 16px;
    max-width: 1500px; margin: 0 auto;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .card h2 { font-size: 13px; margin: 0 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #232b40; }
  .pill.on { background: rgba(62,207,142,0.2); color: var(--good); }
  .pill.off { background: rgba(255,107,107,0.2); color: var(--bad); }
  #boardGrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .cell {
    aspect-ratio: 1; border-radius: 5px; background: #232b40; display: flex; align-items: center;
    justify-content: center; font-size: 10px; color: var(--muted); position: relative; cursor: default;
  }
  .cell.consumed { background: #1c2233; color: #4a5473; }
  .cell.START { background: #2f4a35; color: var(--good); }
  .cell.CHANCE { background: #4a3f2f; color: var(--warn); }
  .cell.AIRPORT { background: #2f3d4a; color: #6fb4ff; }
  .cell.QUARANTINE { background: #4a2f2f; color: var(--bad); }
  .cell.ROULETTE { background: #3f2f4a; color: #c48bff; }
  .cell.here { outline: 2px solid white; z-index: 1; }
  select, input[type=number], input[type=text] {
    background: #0f1420; border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 6px; font-size: 13px;
  }
  .candidate {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  #log {
    grid-column: 1 / -1; max-height: 260px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; white-space: pre-wrap;
  }
  #log .entry { border-bottom: 1px dashed var(--border); padding: 6px 0; }
  #log .ok { color: var(--good); } #log .err { color: var(--bad); }
  .muted { color: var(--muted); }
  .small { font-size: 11.5px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>MSG Board / KOTH 프리뷰</h1>
    <div class="sub">실제 API를 그대로 호출하는 로컬 확인용 페이지 (auth 필요)</div>
  </div>
  <div id="authBox">
    <input id="loginId" placeholder="login_id" value="demo_leader" />
    <input id="password" type="password" placeholder="password" value="demo1234" />
    <button id="loginBtn" onclick="login()">로그인</button>
    <span id="whoami" class="pill muted">로그아웃 상태</span>
    <button class="secondary" onclick="logout()">로그아웃</button>
  </div>
</header>

<main>

  <div class="card">
    <h2>보드 (36칸)</h2>
    <div id="boardGrid"></div>
    <div class="row small muted">
      <span class="pill START">START</span><span class="pill CHANCE">CHANCE</span>
      <span class="pill AIRPORT">AIRPORT</span><span class="pill QUARANTINE">무인도</span>
      <span class="pill ROULETTE">룰렛</span><span class="pill consumed">소모됨</span>
    </div>
  </div>

  <div class="card">
    <h2>내 팀 상태 (/board/me)</h2>
    <div id="meBox" class="kv"></div>
    <button class="secondary" onclick="loadMe()">새로고침</button>
  </div>

  <div class="card">
    <h2>주사위</h2>
    <div id="diceStatusBox" class="kv"></div>
    <div class="row">
      <button onclick="callApi('POST', '/api/v1/board/dice/roll', null, {idem: true})">주사위 굴리기</button>
      <button class="secondary" onclick="callApi('POST', '/api/v1/board/dice/confirm', null, {idem: true})">확정(dice/confirm)</button>
    </div>
    <div class="row small muted">
      진행 중인 문제 때문에 막혔다면 ↓
      <button class="secondary" onclick="callApi('POST', '/board/_debug/solve')">데모용 정답 처리 (API 명세 아님)</button>
    </div>
  </div>

  <div class="card">
    <h2>현재 칸 (/board/cell/current)</h2>
    <button class="secondary" onclick="loadCellCurrent()">현재 칸 조회</button>
    <div id="cellCurrentBox"></div>
  </div>

  <div class="card">
    <h2>찬스카드</h2>
    <div class="row">
      <button class="secondary" onclick="callApi('GET', '/api/v1/board/chance/catalog')">카탈로그</button>
      <button onclick="callApi('POST', '/api/v1/board/chance/now', null, {idem: true})">뽑기 (chance/now)</button>
    </div>
    <div class="row">
      <select id="chanceCardId">
        <option value="card_reroll">card_reroll</option>
        <option value="card_roll_twice_choose">card_roll_twice_choose</option>
        <option value="card_move_offset">card_move_offset</option>
        <option value="card_free_travel">card_free_travel</option>
        <option value="card_extra_roll">card_extra_roll</option>
        <option value="card_quarantine_defense">card_quarantine_defense</option>
        <option value="card_move_to_quarantine">card_move_to_quarantine</option>
      </select>
      <input id="chanceExtra1" type="number" placeholder="offset/destination_index" style="width:150px" />
    </div>
    <button onclick="useChanceCard()">사용 (chance/use)</button>
    <div class="row">
      <select id="chanceChoice"><option value="FIRST">FIRST</option><option value="SECOND">SECOND</option></select>
      <button class="secondary" onclick="callApi('POST', '/api/v1/board/chance/confirm', {choice: val('chanceChoice')}, {idem: true})">확정 (chance/confirm)</button>
    </div>
  </div>

  <div class="card">
    <h2>공항 이동</h2>
    <div class="row">
      <input id="airportDest" type="number" placeholder="destination_index" style="width:150px" />
      <button onclick="callApi('POST', '/api/v1/board/airport/move', {destination_index: num('airportDest')}, {idem: true})">이동</button>
    </div>
  </div>

  <div class="card">
    <h2>열린 문제 목록</h2>
    <button class="secondary" onclick="callApi('GET', '/api/v1/board/opened_challenges')">조회</button>
    <div id="openedBox" class="small"></div>
  </div>

  <div class="card">
    <h2>KOTH</h2>
    <div class="row">
      <button class="secondary" onclick="loadKothClubs()">클럽 목록</button>
      <button class="secondary" onclick="loadKothMe()">내 점수</button>
      <button class="secondary" onclick="callApi('GET', '/api/v1/koth/team_token')">팀 토큰</button>
    </div>
    <div id="kothClubsBox" class="small"></div>
    <div id="kothMeBox" class="small"></div>
    <div class="row">
      <select id="kothChallengeId" style="width:260px"></select>
      <button class="secondary" onclick="loadKothLeaderboard()">순위표</button>
    </div>
    <div id="kothLeaderboardBox" class="small"></div>
  </div>

  <div class="card" style="grid-column: span 3;">
    <h2>요청 로그 (최근이 위)</h2>
    <div id="log"></div>
  </div>

</main>

<script>
let token = localStorage.getItem('msg_token') || '';
let cellCandidates = [];

function val(id) { return document.getElementById(id).value; }
function num(id) { const v = document.getElementById(id).value; return v === '' ? null : Number(v); }

function setToken(t) {
  token = t;
  if (t) localStorage.setItem('msg_token', t); else localStorage.removeItem('msg_token');
  document.getElementById('whoami').textContent = t ? '로그인됨' : '로그아웃 상태';
  document.getElementById('whoami').className = 'pill ' + (t ? 'on' : 'muted');
}

function logEntry(method, path, status, body) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  const ok = status >= 200 && status < 300;
  div.className = 'entry ' + (ok ? 'ok' : 'err');
  div.textContent = `[${new Date().toLocaleTimeString()}] ${method} ${path} -> ${status}\n${JSON.stringify(body, null, 2)}`;
  el.prepend(div);
}

async function callApi(method, path, body, opts) {
  opts = opts || {};
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.idem) headers['Idempotency-Key'] = crypto.randomUUID();

  const res = await fetch(path, {
    method,
    headers,
    body: (method === 'GET' || body === null || body === undefined) ? undefined : JSON.stringify(body),
  });
  let data;
  try { data = await res.json(); } catch (e) { data = { code: 'PARSE_ERROR', message: String(e) }; }
  logEntry(method, path, res.status, data);
  if (res.ok || res.status < 500) {
    afterCall(path, data);
  }
  return { status: res.status, data };
}

function afterCall(path, data) {
  if (path.startsWith('/api/v1/board/me')) renderMe(data.data);
  if (path === '/api/v1/board') renderBoard(data.data);
  if (path === '/api/v1/board/dice/status') renderDiceStatus(data.data);
  if (path === '/api/v1/board/cell/current') renderCellCurrent(data.data);
  if (path === '/api/v1/board/opened_challenges') renderOpened(data.data);
  if (path === '/api/v1/koth/clubs') renderKothClubs(data.data);
  // 대부분의 쓰기 요청 뒤에는 최신 상태를 다시 그린다.
  if (['/api/v1/board/dice/roll', '/api/v1/board/dice/confirm', '/api/v1/board/chance/use',
       '/api/v1/board/chance/confirm', '/api/v1/board/chance/now', '/api/v1/board/airport/move',
       '/api/v1/board/cell/open', '/board/_debug/solve'].includes(path)) {
    loadMe(); loadDiceStatus();
  }
}

async function login() {
  const res = await fetch('/api/v1/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login_id: val('loginId'), password: val('password') }),
  });
  const data = await res.json();
  logEntry('POST', '/api/v1/auth/login', res.status, data);
  if (res.ok) {
    setToken(data.data.access_token);
    await Promise.all([loadMe(), loadDiceStatus(), callApi('GET', '/api/v1/board'), loadKothClubs()]);
  } else {
    alert('로그인 실패: ' + data.message);
  }
}

function logout() { setToken(''); }

async function loadMe() { return callApi('GET', '/api/v1/board/me'); }
async function loadDiceStatus() { return callApi('GET', '/api/v1/board/dice/status'); }
async function loadCellCurrent() { return callApi('GET', '/api/v1/board/cell/current'); }
async function loadKothClubs() { return callApi('GET', '/api/v1/koth/clubs'); }

async function loadKothMe() {
  const res = await callApi('GET', '/api/v1/koth/me');
  renderKothMe(res.data.data);
}

async function loadKothLeaderboard() {
  const kothChallengeId = val('kothChallengeId');
  if (!kothChallengeId) return;
  const res = await callApi(
    'GET', '/api/v1/koth/leaderboard?koth_challenge_id=' + encodeURIComponent(kothChallengeId)
  );
  renderKothLeaderboard(res.data.data);
}

let lastMe = null;
let boardCells = [];

function renderBoard(data) {
  boardCells = data.cells;
  paintBoard();
}

function paintBoard() {
  const grid = document.getElementById('boardGrid');
  grid.innerHTML = '';
  const consumed = new Set((lastMe && lastMe.consumed_cell_indexes) || []);
  const here = lastMe ? lastMe.position : null;
  boardCells.forEach(cell => {
    const div = document.createElement('div');
    div.className = 'cell ' + cell.type + (consumed.has(cell.cell_index) ? ' consumed' : '') + (cell.cell_index === here ? ' here' : '');
    div.title = `${cell.cell_index}: ${cell.name}${cell.difficulty ? ' (' + cell.difficulty + ')' : ''}`;
    div.textContent = cell.cell_index;
    grid.appendChild(div);
  });
}

function renderMe(data) {
  lastMe = data;
  const box = document.getElementById('meBox');
  box.innerHTML = '';
  const rows = [
    ['위치', data.position + ' (' + data.type + ')'],
    ['주사위 남음', data.dice_rolls_left],
    ['무인도', data.is_quarantined ? '예' : '아니오'],
    ['보드 완료', data.board_completed ? '예' : '아니오'],
    ['소모한 칸 수', data.consumed_cell_indexes.length + ' / 36'],
    ['보유 찬스카드', data.chance_cards.map(c => `${c.card_id}${c.used ? '(사용됨)' : c.usable_now ? '(사용가능)' : ''}`).join(', ') || '없음'],
    ['진행 중인 문제', data.active_challenge ? data.active_challenge.challenge_id : '없음'],
  ];
  for (const [k, v] of rows) {
    box.innerHTML += `<div class="k">${k}</div><div>${v}</div>`;
  }
  paintBoard();
}

function renderDiceStatus(data) {
  const box = document.getElementById('diceStatusBox');
  box.innerHTML = `
    <div class="k">굴릴 수 있음</div><div>${data.can_roll ? '예' : '아니오 (' + data.blocked_reason + ')'}</div>
    <div class="k">남은 횟수</div><div>${data.dice_rolls_left}</div>
  `;
}

function renderCellCurrent(data) {
  cellCandidates = data.challenge_candidates || [];
  const box = document.getElementById('cellCurrentBox');
  if (!cellCandidates.length) {
    box.innerHTML = `<div class="small muted">칸 타입: ${data.type} — 후보 문제 없음</div>`;
    return;
  }
  box.innerHTML = cellCandidates.map(c => `
    <div class="candidate">
      <span>${c.title} (${c.category}, ${c.score}점)</span>
      <button onclick="openChallenge('${c.challenge_id}')">열기</button>
    </div>
  `).join('');
}

async function openChallenge(challengeId) {
  await callApi('POST', '/api/v1/board/cell/open', { challenge_id: challengeId }, { idem: true });
  loadCellCurrent();
}

function renderOpened(data) {
  const box = document.getElementById('openedBox');
  box.innerHTML = `<div>총 ${data.total_count} / 해결 ${data.solved_count} / 점수 ${data.total_score}</div>` +
    data.opened_challenges.map(c => `<div>${c.is_solved ? '✔' : '·'} ${c.title} (칸 ${c.cell_index})</div>`).join('');
}

function useChanceCard() {
  const cardId = val('chanceCardId');
  const extra = num('chanceExtra1');
  const body = { card_id: cardId };
  if (cardId === 'card_move_offset') body.offset = extra;
  if (cardId === 'card_free_travel') body.destination_index = extra;
  callApi('POST', '/api/v1/board/chance/use', body, { idem: true });
}

function renderKothClubs(data) {
  const box = document.getElementById('kothClubsBox');
  box.innerHTML = `<div class="muted">문제 ${data.total_count}개 (활성 ${data.active_count}개)</div>` +
    data.clubs.map(club => `
      <div><b>${club.name}</b>
        ${club.challenges.map(c => `
          <div style="margin-left:8px">
            · ${c.title} [${c.category}] (${c.status}, open_group ${c.open_group})
            — 1위: ${c.current_owner_team_name || '없음'} (${c.current_score}점)
            <br/><span class="muted" style="margin-left:8px">koth_challenge_id: ${c.koth_challenge_id}</span>
          </div>
        `).join('')}
      </div>
    `).join('<hr style="border-color:var(--border)"/>');

  const select = document.getElementById('kothChallengeId');
  const allChallenges = data.clubs.flatMap(club => club.challenges.map(c => ({ ...c, clubName: club.name })));
  select.innerHTML = allChallenges
    .map(c => `<option value="${c.koth_challenge_id}">${c.clubName} - ${c.title}</option>`)
    .join('');
}

function renderKothMe(data) {
  const box = document.getElementById('kothMeBox');
  box.innerHTML = `<div>총 KOTH 점수: ${data.total_koth_score}</div>` +
    data.challenges.map(c => `
      <div>· ${c.title}: ${c.earned_score}점${c.rank ? ` (${c.rank}위)` : ''} [${c.status}]</div>
    `).join('');
}

function renderKothLeaderboard(data) {
  const box = document.getElementById('kothLeaderboardBox');
  box.innerHTML = `<div><b>${data.title}</b> 순위표 (${data.status})</div>` +
    (data.leaderboard.length
      ? data.leaderboard.map(row => `<div>${row.rank}. ${row.team_name} — ${row.earned_score}점</div>`).join('')
      : `<div class="muted">아직 점수가 없습니다.</div>`);
}

if (token) {
  setToken(token);
  Promise.all([loadMe(), loadDiceStatus(), callApi('GET', '/api/v1/board')]).catch(() => {});
} else {
  callApi('GET', '/api/v1/board');
}
</script>

</body>
</html>
