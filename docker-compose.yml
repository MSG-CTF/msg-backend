# PostgreSQL과 Redis 개발 컨테이너를 실행한다
services:
  postgres:
    image: postgres:16.14
    container_name: msg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: msg_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - msg_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: msg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  msg_postgres_data:
