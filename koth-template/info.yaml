name: KOTH Problem Name

category: koth

description: |-
    참가자는 KOTH 문제 서버에 접속해 팀 토큰으로 인증한 뒤 목표 상태를 만들고 유지해야 합니다.
    플랫폼 백엔드는 15분마다 문제 서버의 공통 점수 API를 조회해 구간별 등수를 반영합니다.

flag: msgctf2026{replace_this}

# 서버가 필요한 문제이므로 deployment 블록을 작성합니다.
deployment:
  runtime_type: KUBERNETES        # KUBERNETES | DOCKER | VM (정해진 값만)
  architecture: AMD64             # AMD64 | ARM64
  containers:
    - name: service
      build: ./prob/for_organizer/service
      ports: [8080, 9090]     # 8080=참가자 진입점, 9090=헬스체크 전용 (분리 이유는 아래 참고)
      expose: true
  resource_profile:
    cpu_millicores: 500
    memory_mib: 512
    ephemeral_storage_mib: 1024
  # 플랫폼이 주기적으로 찔러 서버 생존을 확인합니다.
  # KOTH는 15분마다 점수를 조회하므로 그 시점에 서버가 죽어 있으면 구간 점수가 통째로 날아갑니다.
  # port는 위 containers에 선언한 포트여야 합니다.
  # 참가자 진입점(8080)과 분리해 9090에 둡니다. KOTH는 참가자가 8080에 부하를 걸어 점유를
  # 다투는 게임이라 같은 포트에 두면 부하 상황에서 헬스체크도 같이 실패해 불필요한 재시작으로
  # 이어지고, 인증 없는 /healthz가 참가자에게 노출되는 것도 바람직하지 않습니다.
  # 주의: expose는 컨테이너 단위이지 포트 단위가 아닙니다. 이 컨테이너가 expose: true이므로
  # 배포 파이프라인이 포트별로 노출을 구분하지 않으면 9090도 참가자에게 열릴 수 있습니다.
  # 플랫폼팀이 파이프라인에서 이 부분을 확인하기 전까지는 9090도 노출된다고 가정하고,
  # /healthz에 민감한 정보를 절대 담지 마세요(200/500 상태만 반환).
  healthcheck:
    container: service
    port: 9090
    path: /healthz
