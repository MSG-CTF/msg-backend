name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/windows-exe-submission-base"]
  workflow_dispatch:
    inputs:
      verify_gcs:
        description: "GCS 참가자 ZIP 업로드·다운로드 검증"
        type: boolean
        default: false
      verify_github_artifacts:
        description: "verify_gcs와 함께 실제 GitHub 발행본 4종도 검증"
        type: boolean
        default: false
      verify_deploy:
        description: "제한된 SSH 배포 경로와 외부 공식 50팀 API 검증"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_gcs && !inputs.verify_deploy)
    uses: ./.github/workflows/security-ci.yml
    with:
      smoke_test_path: /admin/login/

  verify-gcs:
    name: verify-gcs
    if: github.event_name == 'workflow_dispatch' && inputs.verify_gcs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: msg_gcs_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: msg_gcs_smoke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GCS_ENABLED: "True"
      GCS_PROJECT_ID: msg-broker
      GCS_BUCKET_NAME: 2026msg_gcs
      GCS_OBJECT_PREFIX: dev
      GCS_QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate with registered GCP identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/309055091666/locations/global/workloadIdentityPools/github-actions/providers/msg-github-actions
          service_account: gcs-file-upload-devops@msg-broker.iam.gserviceaccount.com
          project_id: msg-broker
          create_credentials_file: true
      - name: Verify GCS upload and authenticated HTTP downloads
        env:
          VERIFY_GITHUB_ARTIFACTS: ${{ inputs.verify_github_artifacts }}
          RELEASE_POLL_GITHUB_TOKEN: ${{ inputs.verify_github_artifacts && secrets.RELEASE_POLL_GITHUB_TOKEN || '' }}
        run: |
          if [ "$VERIFY_GITHUB_ARTIFACTS" = "true" ]; then
            python tools/gcs_smoke.py --github-artifacts --report reports/gcs-smoke.json
          else
            python tools/gcs_smoke.py --report reports/gcs-smoke.json
          fi
      - name: Upload sanitized verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcs-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/gcs-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  deployment-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v

  jenga-contract-tests:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_gcs && !inputs.verify_deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: jenga-contract-local-only
          POSTGRES_DB: jenga_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: jenga_contract
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jenga-contract-local-only
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      JENGA_SOURCE_ROOT: ${{ github.workspace }}/.jenga-contract-source/koth-jenga/prob/for_organizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the reviewed author source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MSG-CTF/2026_MSG_CTF
          ref: faf7ad6d814fb99ab23bd1d0a82d935a5b08be61
          token: ${{ secrets.RELEASE_POLL_GITHUB_TOKEN }}
          path: .jenga-contract-source
          sparse-checkout: koth-jenga/prob/for_organizer
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/jenga_contract/requirements.txt
      - name: Generate independent local service test keys
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name in ['DJANGO_SECRET_KEY', 'JWT_SECRET', 'KOTH_TEAM_TOKEN_SECRET']:
                  env.write(name + '=' + secrets.token_urlsafe(48) + '\n')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r tools/jenga_contract/requirements.txt
      - name: Verify Jenga and platform sessions over real HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          python manage.py test tools.jenga_contract.contract_suite --noinput -v 2 2>&1 | tee jenga-contract-tests.log
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('jenga-contract-tests.log').read_text()
          count = re.search(r'Ran (\d+) tests? in', text)
          if not count or int(count[1]) < 18:
              raise SystemExit('Expected at least 18 actual Jenga contract tests')
          PY

  deploy-preflight:
    needs: deployment-tests
    if: github.event_name == 'workflow_dispatch' && inputs.verify_deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify pinned SSH, fixed helpers and official 50-team public APIs
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          BACKEND_DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          BACKEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        run: python3 deploy/send_backend_release.py probe

  deploy-development:
    needs: [ci, deployment-tests, jenga-contract-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deploy and verify current main, or explicitly skip a superseded revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          BACKEND_DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          BACKEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        run: python3 deploy/send_backend_release.py deploy
