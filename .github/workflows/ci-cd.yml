name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MSG-CTF/jm_devsecops/.github/workflows/reusable-ci.yml@v3.3.1
    with:
      smoke_test_path: /admin/login/

  deploy-development:
    name: deploy-development
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: MSG-CTF/jm_devsecops/.github/workflows/reusable-vm-deploy-dev.yml@071b962f93badd9b41a15af2df37517e4e4d5bde
    with:
      component: backend
      commit_sha: ${{ github.sha }}
      pipeline_ref: 071b962f93badd9b41a15af2df37517e4e4d5bde
      gcp_project_id: project-325bdf5b-3d83-4f27-9f6
      workload_identity_provider: projects/269174025178/locations/global/workloadIdentityPools/github-vm-cd-dev/providers/github-vm-cd-provider
      deployer_service_account: github-vm-deployer-dev@project-325bdf5b-3d83-4f27-9f6.iam.gserviceaccount.com
      vm_zone: asia-northeast3-a
      vm_name: backend-dev-vm
      public_domain: msg2.mjsec.kr
