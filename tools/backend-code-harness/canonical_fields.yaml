  team_name: 팀 이름
  cell_index: 보드 칸 번호
  board_event_code: 보드 이벤트 결과

deprecated_field_names:
  id: public API response/request에서 단독 식별자 이름으로 사용 금지
  index: 보드 칸 번호로 사용 금지. cell_index를 사용
  event_triggered: 보드 이벤트 결과로 사용 금지. board_event_code를 사용
  total_cells: 보드 전체 칸 개수로 사용 금지. total_cell_count를 사용